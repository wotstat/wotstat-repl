[package]
name = "wotstat-repl"
version = "1.4.0"
description = "WotStat desktop IDE for World of Tanks Python mod development"
authors = ["WotStat"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "wotstat_repl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
atomic-write-file = "0.3.1"
socket2 = "0.6"
if-addrs = "0.14.0"
toml_edit = "0.25.12"
rmcp = { version = "3.1.2", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
