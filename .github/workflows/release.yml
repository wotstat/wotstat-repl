name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-mod:
    name: Build game mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build embedded web frontend
        run: bun run build:web

      - name: Install Python 2.7
        shell: pwsh
        run: choco install python2 --version=2.7.18 -y --no-progress

      - name: Test and build game mod
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:\Python27\python.exe'
          foreach ($test in @('test_exec.py', 'selftest.py', 'itest.py', 'test_complete.py', 'test_web.py', 'test_hybrid.py')) {
            & $python "mod/tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Agent test failed: $test" }
          }

          $embedded = 'src-tauri/resources/wotstat.repl.mod'
          & $python mod/build.py --version $env:GITHUB_REF_NAME --web-dist dist-web --out $embedded
          if ($LASTEXITCODE -ne 0) { throw 'Game mod build failed' }

          New-Item release-assets -ItemType Directory -Force | Out-Null
          Copy-Item $embedded "release-assets/wotstat.repl_$env:GITHUB_REF_NAME.wotmod"
          Copy-Item $embedded "release-assets/wotstat.repl_$env:GITHUB_REF_NAME.mtmod"

      - name: Upload embedded mod
        uses: actions/upload-artifact@v4
        with:
          name: embedded-agent-mod
          path: src-tauri/resources/wotstat.repl.mod
          if-no-files-found: error

      - name: Upload game mods
        uses: actions/upload-artifact@v4
        with:
          name: release-mod
          path: |
            release-assets/*.wotmod
            release-assets/*.mtmod
          if-no-files-found: error

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: build-mod
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            os: windows-latest
          - name: Linux x64
            platform: linux
            os: ubuntu-22.04
          - name: macOS universal
            platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download embedded mod
        uses: actions/download-artifact@v4
        with:
          name: embedded-agent-mod
          path: src-tauri/resources

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: bun install --frozen-lockfile

      - name: Test desktop backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Check frontend architecture
        run: bun run lint:fsd

      - name: Write release version config
        if: matrix.platform != 'windows'
        shell: bash
        run: printf '{"version":"%s"}\n' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/tauri-version.json"

      - name: Write release version config
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          @{ version = $env:GITHUB_REF_NAME } | ConvertTo-Json -Compress |
            Set-Content "$env:RUNNER_TEMP/tauri-version.json" -Encoding ASCII

      - name: Build Windows bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        run: bun run tauri build --ci --config "$env:RUNNER_TEMP/tauri-version.json" --bundles nsis --no-sign

      - name: Build Linux bundles
        if: matrix.platform == 'linux'
        shell: bash
        run: bun run tauri build --ci --config "$RUNNER_TEMP/tauri-version.json" --bundles deb,appimage --no-sign

      - name: Build universal macOS bundle
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --ci --config "$RUNNER_TEMP/tauri-version.json" --target universal-apple-darwin --bundles dmg

      - name: Collect Windows release files
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item release-assets -ItemType Directory -Force | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          Copy-Item src-tauri/target/release/wotstat-repl.exe "release-assets/wotstat-repl_${env:GITHUB_REF_NAME}.exe"
          Copy-Item $installers[0] "release-assets/wotstat-repl_${env:GITHUB_REF_NAME}_win64-setup.exe"

      - name: Collect Linux release files
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected exactly one Debian package, found ${#debs[@]}" >&2; exit 1; }
          [[ ${#appimages[@]} -eq 1 ]] || { echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2; exit 1; }
          cp "${debs[0]}" "release-assets/wotstat-repl_${GITHUB_REF_NAME}_linux.deb"
          cp "${appimages[0]}" "release-assets/wotstat-repl_${GITHUB_REF_NAME}_linux.AppImage"

      - name: Collect macOS release files
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "Expected exactly one macOS image, found ${#dmgs[@]}" >&2; exit 1; }
          cp "${dmgs[0]}" "release-assets/wotstat-repl_${GITHUB_REF_NAME}_macos.dmg"

      - name: Upload desktop release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create draft release
    needs:
      - build-mod
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: WotStat REPL ${{ github.ref_name }}
          body: |
            Desktop downloads:

            - Windows: `wotstat-repl_${{ github.ref_name }}.exe` (portable) or `wotstat-repl_${{ github.ref_name }}_win64-setup.exe` (installer).
            - macOS: `wotstat-repl_${{ github.ref_name }}_macos.dmg` for Apple Silicon and Intel Macs.
            - Linux x64: `wotstat-repl_${{ github.ref_name }}_linux.AppImage` or `wotstat-repl_${{ github.ref_name }}_linux.deb`.

            Game mods:

            - `wotstat.repl_${{ github.ref_name }}.wotmod` for World of Tanks.
            - `wotstat.repl_${{ github.ref_name }}.mtmod` for Mir Tankov.

            Both files contain the same universal game agent. It connects to the desktop application over TCP and simultaneously hosts a standalone REPL UI at `http://127.0.0.1:8768/`. The same mod is embedded in every desktop build.
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
