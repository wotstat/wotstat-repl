name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 2.7
        shell: pwsh
        run: choco install python2 --version=2.7.18 -y --no-progress

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Test and build Windows release
        shell: pwsh
        run: ./build-windows.ps1 -Version $env:GITHUB_REF_NAME

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: WotStat WoT REPL ${{ github.ref_name }}
          body: |
            Windows downloads:

            - `wotstat-repl.exe` runs directly without installation. On a standard Windows 10/11 system, this is all you need.
            - `*-setup.exe` installs the app and ensures that the WebView2 runtime is available.
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/wotstat-repl.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
