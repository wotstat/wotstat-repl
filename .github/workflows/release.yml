name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 2.7
        shell: pwsh
        run: choco install python2 --version=2.7.18 -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test and build Windows release
        shell: pwsh
        run: ./build-windows.ps1 -Version $env:GITHUB_REF_NAME

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Fuflo WoT REPL ${{ github.ref_name }}
          body: |
            Windows installers (`.msi` and `.exe`) are attached below.

            Dev/private use only — see the README.
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
